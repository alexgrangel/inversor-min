name: decision-diaria

# El cron de GitHub Actions es la infraestructura completa de este sistema:
# cómputo gratis, secreto gestionado, y —lo más importante— cada corrida queda
# committeada con timestamp inmutable. Ese historial ES el log walk-forward.
# Sin él, en seis meses no puedes distinguir entre que el sistema funcionó y
# que te acuerdas de que funcionó.
#
# Calendario (confirmado 10-ago-2026): el FIX se publica ~12:30 CDMX, la
# subasta de CETES es los martes (resultados esa tarde; la serie SF606xx viene
# fechada a la SUBASTA, no a la colocación del jueves). El cron a las 14:00
# CDMX captura el FIX del día; si los resultados de la subasta del martes aún
# no están en SIE a esa hora, el límite de rancidez de 9 días cubre con la
# subasta previa sin bloquear.

on:
  schedule:
    - cron: "0 20 * * 1-5"   # 14:00 CDMX (UTC-6 fijo: México ya no tiene horario de verano)
  workflow_dispatch:
    inputs:
      held_mxn:
        description: "Sleeve cripto actual en MXN"
        default: "0"

permissions:
  contents: write

concurrency:
  group: decision-diaria
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (fallar aquí es preferible a publicar una decisión mala)
        working-directory: engine
        run: |
          pip install -q pytest
          python -m pytest -q

      - name: Verificar IDs de serie contra el catálogo oficial
        # El pin offline de IDs vive en test_banxico.py; esto atrapa lo que el
        # pin no puede: que Banxico renombre o redefina una serie. Si un título
        # deja de corresponder, NO se publica decisión hoy (regla 5).
        working-directory: engine
        env:
          PYTHONPATH: src
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python -m inversor verify-series

      - name: Generar decisión
        working-directory: engine
        env:
          PYTHONPATH: src   # sin esto `python -m inversor` no encuentra el paquete
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # opcional; market_stress degrada sin ella
        run: |
          # exit 2 = decisión BLOQUEADA. Es una salida VÁLIDA y se publica:
          # el log walk-forward debe mostrar los días bloqueados (reglas 3 y
          # 4), y el estado de cooldowns debe persistir aunque hoy se bloquee.
          # Cualquier otro código distinto de 0 es un fallo real del engine.
          set +e
          python -m inversor run \
            --capital "${{ vars.CAPITAL_MXN || '50000' }}" \
            --reserve "${{ vars.RESERVE_MXN || '5000' }}" \
            --horizon "${{ vars.HORIZON_DAYS || '364' }}" \
            --isr "${{ vars.ISR_MARGINAL || '0.30' }}" \
            --held "${{ github.event.inputs.held_mxn || vars.HELD_MXN || '0' }}" \
            --fees-ytd "${{ vars.FEES_YTD_MXN || '0' }}" \
            --out ../snapshots
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          [ "$code" -eq 2 ] && echo "::warning::Decisión de hoy: BLOQUEADA (se publica igual)"
          true

      - name: notifications.json es append-only — fallar si se encogió
        # Es el log Y la memoria de cooldowns e histéresis entre corridas. Si
        # se encoge, el anti-spam pierde el estado y el sistema vuelve a
        # avisar de todo. Encogerse incluye desaparecer.
        run: |
          if git cat-file -e HEAD:snapshots/notifications.json 2>/dev/null; then
            viejo=$(git show HEAD:snapshots/notifications.json | jq length)
            if [ ! -f snapshots/notifications.json ]; then
              echo "::error::snapshots/notifications.json desapareció (HEAD tenía $viejo registros)"
              exit 1
            fi
            nuevo=$(jq length snapshots/notifications.json)
            if [ "$nuevo" -lt "$viejo" ]; then
              echo "::error::notifications.json se encogió: $viejo → $nuevo registros. Append-only violado."
              exit 1
            fi
            echo "append-only OK: $viejo → $nuevo registros"
          else
            echo "primera corrida: no hay notifications.json previo en HEAD"
          fi

      - name: Commit del snapshot
        run: |
          git config user.name  "inversor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshots/
          git diff --staged --quiet || git commit -m "decisión $(date -u +%F)"
          git push

      - name: Avisos por ntfy.sh
        # DESPUÉS del commit, a propósito: un aviso entregado cuyo cooldown no
        # quedó persistido se re-dispararía mañana. Sin NTFY_TOPIC el paso se
        # omite solo; con 0 avisos no manda nada (el silencio no se entrega).
        working-directory: engine
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m inversor.scripts.ntfy_push ../snapshots/notifications-latest.json

      - name: Resumen en el job
        run: cat snapshots/latest.md >> "$GITHUB_STEP_SUMMARY"
